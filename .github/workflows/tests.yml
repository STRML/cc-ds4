name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is not decoration: the launch agents run /usr/bin/python3, which is
        # 3.9 on macOS, so the proxies have to import and run there. 3.12 is what
        # a brew or pyenv user gets. The README claims 3.9+, so prove it.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q src tools

  go-test:
    # The Go proxy is the Phase A target. Build it, vet, and race-test the
    # concurrency-critical packages on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go vet + test
        run: |
          cd src/go
          go vet ./...
          go test ./...
          go test -race ./internal/proxy/ ./internal/relay/

  diff-harness:
    # The differential harness proves the Go proxy is byte-identical to the
    # Python oracle on the Phase A corpus. Boots the Python proxy in-process
    # and the Go binary at the same fake upstreams, then compares.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build + differential harness
        run: |
          cd src/go
          go build -o cmd/ds4-proxy/ds4-proxy ./cmd/ds4-proxy
          cd ../..
          mkdir -p "$HOME/.claude-ds4" "$HOME/.claude-or-ds4" "$HOME/.claude-nous"
          python3 tests/diff/run_diff.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh src/ds4-proxy-kickstart.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning install.sh src/ds4-proxy-kickstart.sh
      # tests/test_install.sh exercises arg parsing, symlinks, the embedded
      # settings.json rewrite, and stale-symlink cleanup. On Linux the
      # proxy base-URL rewrite runs (Darwin skips the launchctl path).
      - name: install-script tests
        run: bash tests/test_install.sh

  proxies-start:
    # The unit tests import the proxies but never bind a socket. A proxy that is
    # syntax-clean and still dies on startup breaks every profile, and that
    # failure stays invisible until someone launches a session.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: each proxy binds its port and forwards
        run: |
          set -euo pipefail
          # One process serves every profile whose directory exists, so make one.
          mkdir -p "$HOME/.claude-ds4" "$HOME/.claude-or-ds4" "$HOME/.claude-nous"
          DS4_IDLE_EXIT=0 python3 src/proxy.py &
          pid=$!
          for port in 31500 31501 31502; do
            for _ in $(seq 40); do
              python3 -c "import socket,sys; sys.exit(socket.socket().connect_ex(('127.0.0.1',$port)))" && break
              sleep 0.25
            done
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              -X POST "http://127.0.0.1:$port/v1/messages" \
              -H 'content-type: application/json' \
              -d '{"model":"ds4-low","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}' || true)
            echo "port $port -> HTTP $code"
            # Any status proves it bound, parsed the body, and reached upstream.
            # 000 means curl got no response at all, which is the real failure.
            test "$code" != "000"
          done
          kill $pid

  macos:
    # macOS is the primary platform (launchd agents, plists, /usr/bin/python3),
    # but the rest of this file is Linux-only, so every Darwin-only path ships
    # unverified. Mirror the Linux jobs on a real macOS runner and add a plutil
    # lint on the generated plist. Free on public repos.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: system python3 (what launchd runs)
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python 3.12
        run: python3 -m unittest discover -s tests -v
      - name: compile
        run: python3 -m compileall -q src tools
      - name: shell checks
        run: |
          brew install shellcheck >/dev/null 2>&1
          bash -n install.sh src/ds4-proxy-kickstart.sh
          shellcheck --severity=warning install.sh src/ds4-proxy-kickstart.sh
      - name: install-script tests
        run: bash tests/test_install.sh
      - name: generated plist is valid (plutil)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/.claude-ds4" "$tmp/Library/LaunchAgents"
          printf '{"env":{}}' > "$tmp/.claude-ds4/settings.json"
          stub="$(mktemp -d)"
          printf '#!/bin/sh\nexit 0\n' > "$stub/launchctl"
          chmod +x "$stub/launchctl"
          PATH="$stub:$PATH" HOME="$tmp" bash install.sh --profile direct >/dev/null
          plist="$tmp/Library/LaunchAgents/com.strml.cc-ds4.proxy.plist"
          test -f "$plist" || { echo "plist not generated"; exit 1; }
          plutil -lint "$plist"
